[general]
data_dir = data
timezone = Europe/Sofia
contact = https://github.com/Lightwell-bg/bg-promos
raw_retention_days = 14

[http]
timeout = 30
delay_seconds = 1.0
retries = 3
backoff_seconds = 2

[schedule]
# Local (Europe/Sofia) collection slots, used by `collect --scheduled`
slots = 06:30,12:30,18:30

[completeness]
history_runs = 5
min_ratio = 0.6
stale_after_hours = 36
# Failed runs are retried on the following hourly cron ticks, at most this many runs per slot
max_retries_per_slot = 3

[lidl]
enabled = true
min_expected_offers = 50
api_url = https://www.lidl.bg/q/api/search
page_size = 60
max_pages = 60

[kaufland]
enabled = true
min_expected_offers = 500
url = https://www.kaufland.bg/aktualni-predlozheniya/oferti.html

[billa]
enabled = true
min_expected_offers = 100
urls = https://ssbbilla.site/catalog/sedmichna-broshura,https://ssbbilla.site/catalog/predstoyashta-broshura
