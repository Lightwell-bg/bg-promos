[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bg-promos"
version = "0.1.0"
description = "Collects current promo offers of Lidl, Kaufland and BILLA (Bulgaria) into SQLite and exports JSON"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "beautifulsoup4==4.15.0",
    "tzdata==2026.5",
    "python-dotenv==1.2.4",
    "fastapi==0.143.3",
    "uvicorn==0.54.0",
    "aiogram==3.28.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
bg-promos = "bg_promos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
