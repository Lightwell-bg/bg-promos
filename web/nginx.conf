# Static PWA + /api proxy. Copied to /etc/nginx/conf.d/default.conf in the image.
# The host nginx (TLS) proxies everything to 127.0.0.1:8002, which is this container.

# Keep the scheme the host nginx saw (https); fall back to our own.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The host nginx has gzip off: compression happens here.
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types application/json application/javascript text/javascript text/css image/svg+xml application/xml text/xml application/manifest+json text/plain;

    include /etc/nginx/snippets/security-headers.conf;

    # API (FastAPI service "api" in docker compose).
    # The upstream is resolved at request time (Docker DNS), so nginx starts and survives
    # recreation of the api container (new IP). A variable in proxy_pass without a URI part
    # passes the original request URI unchanged.
    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8001;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        client_max_body_size 16k;
        proxy_read_timeout 30s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Hashed build output: cache for a year.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Files that must always be revalidated (new deploys, service worker updates).
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /registerSW.js {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
    location ~ ^/workbox-[0-9a-f]+\.js$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Home: prerendered root.html (links to /bg and /ru; the app redirects by language).
    location = / {
        try_files /root.html /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Static SEO files.
    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Icons, og-image and other unhashed files.
    location ~* \.(png|ico|svg|jpg|webp)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Any other static-looking path (outside /assets/, not matched above) is a real file or a 404,
    # never the SPA fallback: a missing .js/.css must not come back as index.html with 200.
    location ~* \.(js|css|png|jpg|svg|ico|webp|json|txt|xml|map|webmanifest)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Closed stats section (/admin): the SPA shell, never indexed, never cached.
    location ^~ /admin {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Prerendered pages (/bg, /ru/catalog, /bg/c/produce, ...) and the SPA fallback.
    # "$uri/index.html" (not "$uri/") avoids a redirect to the trailing-slash URL.
    location / {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
