# Included by every location that sets its own add_header (nginx does not inherit
# add_header into a location that declares one).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self'; img-src 'self' data: https://kaufland.media.schwarz https://imgproxy-retcat.assets.schwarz https://media.kaufland.com https://www.lidl.bg https://*.google-analytics.com https://*.googletagmanager.com; font-src 'self'; connect-src 'self' https://kaufland.media.schwarz https://imgproxy-retcat.assets.schwarz https://media.kaufland.com https://www.lidl.bg https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
